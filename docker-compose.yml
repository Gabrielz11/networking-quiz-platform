services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumina_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - lumina_postgres_data:/var/lib/postgresql/data
    networks:
      - lumina_network

  redis:
    image: redis:7-alpine
    container_name: lumina_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - lumina_redis_data:/data
    networks:
      - lumina_network

  rag-evaluation:
    build:
      context: ./services/rag-evaluation
      dockerfile: Dockerfile
    container_name: lumina_rag_evaluation
    restart: always
    ports:
      - '8000:8000'
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - lumina_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lumina_postgres_data:
  lumina_redis_data:

networks:
  lumina_network:
    driver: bridge
